name: "Environment Variables"
on: 
  workflow_dispatch:
    inputs:
      environment:
        description: name of the env
        required: true
        default: dev
        options:
          - dev
          - test
          - prod
      artifact_tag:
          description: artifactory tags
          required: true
jobs:
   env-test:
      runs-on: ubuntu-latest
      steps:
        - name: connection env
          run: echo "App is using ${{ inputs.artifact_tag }} art tag on ${{ inputs.environment }}"
