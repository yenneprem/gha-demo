name: "Environment Variables"
on: 
  workflow_dispatch:
    inputs:
      environment:
        description: name of the env
        required: true
        default: dev
        options:
          - dev
          - test
          - prod
jobs:
   env-test:
      runs-on: ubuntu-latest
      steps:
        - name: connection env
          run: echo "App is connectin to ${{ inputs.environment }}"
